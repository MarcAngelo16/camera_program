<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camera Control</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #666;
    --border: #e2e2e4;
    --accent: #2563eb;
    --danger: #dc2626;
    --ok: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --card: #202126;
      --text: #ececec;
      --muted: #9a9a9e;
      --border: #34353b;
      --accent: #5b8def;
      --danger: #f0605e;
      --ok: #4ade80;
    }
  }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; margin: 0; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 32px 20px; }
  h1 { font-size: 20px; margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
  .dot.on { background: var(--ok); }
  .dot.off { background: var(--danger); }
  .muted { color: var(--muted); font-size: 13px; }
  button { font-size: 14px; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  button.stop { background: var(--danger); color: white; border-color: var(--danger); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .actions { display: flex; gap: 10px; margin-top: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); }
  a { color: var(--accent); }
  #err { color: var(--danger); font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Camera Control</h1>

  <div class="card">
    <div class="row">
      <div>
        <span id="statusDot" class="dot off"></span>
        <strong id="statusText">Checking camera...</strong>
      </div>
      <div class="muted" id="deviceInfo"></div>
    </div>
    <div class="row" style="margin-top: 14px;">
      <label class="muted" for="resSelect">Resolution</label>
      <select id="resSelect" onchange="applyResolution()"></select>
    </div>
    <div class="actions">
      <button id="btnStart" class="primary" onclick="startRecording()">Start Recording</button>
      <button id="btnStop" class="stop" onclick="stopRecording()" disabled>Stop Recording</button>
      <button id="btnSnap" onclick="takeSnapshot()">Snapshot</button>
    </div>
    <div class="muted" id="recordingSize"></div>
    <div id="err"></div>
  </div>

  <div class="card">
    <strong>Resource usage</strong>
    <table id="statsTable" style="margin-top: 10px;">
      <tbody>
        <tr><td class="muted">ISP time / frame</td><td id="statIsp">—</td></tr>
        <tr><td class="muted">ISP CPU load</td><td id="statIspCpu">—</td></tr>
        <tr><td class="muted">Frame buffer (fixed)</td><td id="statBuffer">—</td></tr>
        <tr><td class="muted">Achieved frame rate</td><td id="statFps">—</td></tr>
        <tr><td class="muted">Frame speed tier</td><td id="statFrameSpeed">—</td></tr>
        <tr><td class="muted">Auto-exposure / exposure time</td><td id="statExposure">—</td></tr>
        <tr><td class="muted">Last upload to server</td><td id="statUpload">—</td></tr>
        <tr><td class="muted">Whole process (total)</td><td id="statProcess">—</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card">
    <div class="row">
      <strong>Saved files</strong>
      <button onclick="loadRecordings()">Refresh</button>
    </div>
    <table id="fileTable">
      <thead><tr><th>Name</th><th>Size</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}

function setError(msg) {
  document.getElementById('err').textContent = msg || '';
}

function setUnreachable(message) {
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  const info = document.getElementById('deviceInfo');

  dot.className = 'dot off';
  text.textContent = 'Camera service unreachable';
  info.textContent = message;

  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnStop').disabled = true;
  document.getElementById('btnSnap').disabled = true;
}

let recordingStartedAtMs = null;
let resolutionSynced = false;

async function loadResolutions() {
  try {
    const data = await api('/api/camera/resolutions');
    const sel = document.getElementById('resSelect');
    sel.innerHTML = '';
    for (const p of data.presets) {
      const opt = document.createElement('option');
      opt.value = p.index;
      opt.dataset.width = p.width;
      opt.dataset.height = p.height;
      opt.textContent = `${p.width}x${p.height}` + (p.description ? ` (${p.description})` : '');
      sel.appendChild(opt);
    }
  } catch (e) { /* camera/edge box not reachable yet; status polling will retry */ }
}

async function applyResolution() {
  setError('');
  const sel = document.getElementById('resSelect');
  try {
    await api('/api/camera/resolution', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ index: Number(sel.value) }),
    });
  } catch (e) { setError(e.message); }
}

async function refreshStatus() {
  try {
    const s = await api('/api/camera/status');
    const dot = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    const info = document.getElementById('deviceInfo');

    dot.className = 'dot ' + (s.connected ? 'on' : 'off');
    text.textContent = s.connected ? 'Camera connected' : 'Camera not found';
    info.textContent = s.connected ? `${s.device.friendly_name} (${s.device.serial_number})` : (s.last_error || '');

    document.getElementById('btnStart').disabled = !s.connected || s.recording;
    document.getElementById('btnStop').disabled = !s.connected || !s.recording;
    document.getElementById('btnSnap').disabled = !s.connected;
    document.getElementById('resSelect').disabled = !s.connected || s.recording;

    const sizeEl = document.getElementById('recordingSize');
    if (s.recording && s.current_file_size_bytes != null) {
      recordingStartedAtMs = recordingStartedAtMs || new Date(s.recording_started_at).getTime();
      const elapsedMin = Math.max((Date.now() - recordingStartedAtMs) / 60000, 1 / 60);
      const mb = s.current_file_size_bytes / 1e6;
      sizeEl.textContent = `Recorded so far: ${mb.toFixed(1)} MB (~${(mb / elapsedMin).toFixed(1)} MB/min)`;
    } else {
      recordingStartedAtMs = null;
      sizeEl.textContent = '';
    }

    if (s.connected && s.current_resolution && !resolutionSynced) {
      const sel = document.getElementById('resSelect');
      for (const opt of sel.options) {
        if (opt.dataset.width === String(s.current_resolution.width) &&
            opt.dataset.height === String(s.current_resolution.height)) {
          sel.value = opt.value;
          resolutionSynced = true;
          break;
        }
      }
    }
    setError('');
  } catch (e) {
    // The edge box (laptop) is unreachable over the tunnel, or its app isn't
    // running — distinct from "camera not found", which is a normal status
    // response from a reachable app that just has no camera plugged in.
    setUnreachable('The recording computer for this field is offline or unreachable.');
  }
}

async function startRecording() {
  setError('');
  try {
    await api('/api/record/start', { method: 'POST' });
  } catch (e) { setError(e.message); }
  refreshStatus();
}

async function stopRecording() {
  setError('');
  try {
    await api('/api/record/stop', { method: 'POST' });
    loadRecordings();
  } catch (e) { setError(e.message); }
  refreshStatus();
}

async function takeSnapshot() {
  setError('');
  try {
    await api('/api/snapshot', { method: 'POST' });
    loadRecordings();
  } catch (e) { setError(e.message); }
}

function fmtSize(bytes) {
  if (bytes > 1e6) return (bytes / 1e6).toFixed(1) + ' MB';
  if (bytes > 1e3) return (bytes / 1e3).toFixed(1) + ' KB';
  return bytes + ' B';
}

async function loadRecordings() {
  try {
    const data = await api('/api/recordings');
    const tbody = document.querySelector('#fileTable tbody');
    tbody.innerHTML = '';
    for (const f of data.files.reverse()) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${f.name}</td><td>${fmtSize(f.size_bytes)}</td>` +
        `<td><a href="/api/recordings/${encodeURIComponent(f.name)}">Download</a></td>`;
      tbody.appendChild(tr);
    }
  } catch (e) { setError(e.message); }
}

async function refreshStats() {
  try {
    const s = await api('/api/camera/stats');

    document.getElementById('statIsp').textContent = s.isp_ms_avg != null
      ? `${s.isp_ms_avg.toFixed(1)} ms avg (last ${s.isp_ms_last.toFixed(1)} ms)`
      : 'no frames processed yet';
    document.getElementById('statIspCpu').textContent = s.isp_cpu_load_cores != null
      ? `${s.isp_cpu_load_cores.toFixed(2)} cores (of ${s.cpu_count} available)`
      : '—';
    document.getElementById('statBuffer').textContent = s.frame_buffer_mb != null
      ? `${s.frame_buffer_mb.toFixed(1)} MB`
      : '—';
    document.getElementById('statFps').textContent = s.achieved_fps != null
      ? `${s.achieved_fps.toFixed(1)} fps`
      : '—';
    document.getElementById('statFrameSpeed').textContent = s.frame_speed_index != null
      ? `${s.frame_speed_index} of 0-${s.frame_speed_max_index} (higher = faster)`
      : '—';
    document.getElementById('statExposure').textContent = s.exposure_time_us != null
      ? `${s.ae_enabled ? 'auto' : 'manual'}, ${(s.exposure_time_us / 1000).toFixed(2)} ms`
      : '—';

    const u = s.last_upload;
    document.getElementById('statUpload').textContent = u && u.filename
      ? (u.error
          ? `failed: ${u.filename} (${u.error})`
          : `${u.filename}: ${u.mb.toFixed(1)} MB in ${u.duration_s.toFixed(1)}s (${u.mbps.toFixed(1)} MB/s)`)
      : 'no uploads yet';

    document.getElementById('statProcess').textContent =
      `${s.process_cores_used.toFixed(2)} cores, ${s.process_rss_mb.toFixed(0)} MB RAM`;
  } catch (e) { /* edge box unreachable; refreshStatus already surfaces this */ }
}

refreshStatus();
loadRecordings();
loadResolutions();
refreshStats();
setInterval(refreshStatus, 3000);
setInterval(refreshStats, 3000);
</script>
</body>
</html>
